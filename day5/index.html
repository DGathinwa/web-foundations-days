<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 5 Assignment - Users Explorer</title>
    <script src="users.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Users Explorer</h1>
    </header>
 
    <main>
      <section>
        <button id="load-users">Load Users</button>
        
        <div class="filter-group" style="margin: 16px 0;">
          <label for="filter-input">Filter by name: </label>
          <input type="text" id="filter-input" placeholder="Type a name..." autocomplete="off" />
        </div>
 
        <p id="status"></p>
        <ul id="users-list" style="list-style: none; padding: 0;"></ul>
      </section>
    </main>
  </body>
</html>
